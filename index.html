<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YODIO</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg:#0f0e14; --fg:#ece8f4; --mute:#9a94a8; --accent:#b9a2ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:24px 16px; }
  main { max-width:420px; text-align:center; }
  img { width:120px; height:120px; border-radius:50%; }
  h1 { margin:16px 0 4px; font-size:32px; letter-spacing:.08em; }
  p { color:var(--mute); line-height:1.6; margin:0 0 24px; }
  nav a { display:inline-block; margin:6px; padding:10px 18px; border:1px solid #3a3550; border-radius:999px;
          color:var(--fg); text-decoration:none; }
  nav a:hover { border-color:var(--accent); color:var(--accent); }
  footer { margin-top:32px; font-size:13px; }
  footer a { color:var(--mute); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="YODIO">
  <h1>YODIO</h1>
  <p>Korean ballad &amp; R&amp;B<br>밤에 듣기 좋은 발라드와 R&amp;B를 만듭니다.</p>
  <nav>
    <a href="https://www.youtube.com/@yodiomusic">YouTube</a>
    <a href="https://www.instagram.com/yodiomusic">Instagram</a>
  </nav>
  <footer><a href="privacy.html">Privacy Policy · 개인정보처리방침</a></footer>
</main>
</body>
</html>
